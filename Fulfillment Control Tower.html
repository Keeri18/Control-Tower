html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3,.num{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
header{background:var(--ink);color:var(--bg);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:26px;color:var(--pri)}
nav{display:flex;gap:4px;flex:1}
nav button{background:none;border:0;color:inherit;font:600 16px Barlow;padding:8px 14px;border-radius:6px;cursor:pointer;opacity:.75}
nav button.on{background:var(--pri);color:#17202B;opacity:1}
.clock{display:flex;align-items:center;gap:8px;font-size:15px}
.clock b{font:700 24px 'Barlow Condensed'}
.btn{font:600 16px Barlow;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:6px;cursor:pointer}
.btn.p{background:var(--ink);color:var(--bg)}.btn.y{background:var(--pri);border-color:var(--pri);color:#17202B}
.btn.sm{padding:5px 10px;font-size:14px}
header .btn{background:none;border-color:#7d8894;color:inherit;padding:5px 10px;font-size:14px}
main{max-width:1240px;margin:0 auto;padding:16px}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:16px}
.stats div{display:flex;align-items:baseline;gap:8px}.stats .num{font-size:40px;line-height:1}
.stats span{color:var(--mut)}
.red{color:var(--red)}.amb{color:var(--amb)}.grn{color:var(--grn)}.blu{color:var(--blu)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px}
.alert{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.alert:first-of-type{border-top:0}.alert .why{flex:1;min-width:200px}
.tag{display:inline-block;font:600 13px Barlow;padding:2px 8px;border-radius:4px;border:1.5px solid currentColor}
.tag.pri{background:var(--pri);border-color:var(--pri);color:#17202B}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto}
.col h3{font-size:20px;margin-bottom:8px;display:flex;justify-content:space-between}
.col h3 span{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;font-size:14px}
.card.pri{border-left-color:var(--pri)}.card.late{outline:2px solid var(--red)}.card.risk{outline:2px solid var(--amb)}.card.blocked{outline:2px dashed var(--mut)}
.card b{font-size:16px}.mut{color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.couriers{display:grid;gap:6px;margin-top:8px}
.couriers button{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 8px;font:14px Barlow;cursor:pointer}
.couriers button.rec{border-color:var(--grn)}
.job{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:10px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}
.job.pri{border-left-color:var(--pri)}.job.hold{opacity:.55}
.job .num{font-size:30px}.job .info{flex:1;min-width:220px}
.job .btn{font-size:20px;padding:12px 24px}
.line{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--card)}
.line.done{border-color:var(--grn);opacity:.7}
.loc{font:700 34px 'Barlow Condensed';background:var(--ink);color:var(--pri);padding:2px 12px;border-radius:6px}
.var{font:700 30px 'Barlow Condensed'}
.scanbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.scanbar input{flex:1;min-width:200px;font:600 22px Barlow;padding:12px;border:3px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink);text-transform:uppercase}
.msg{padding:12px 14px;border-radius:8px;font-weight:600;margin-bottom:10px}
.msg.ok{background:var(--grn);color:#fff}.msg.bad{background:var(--red);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mut)}
.chips button{font:13px Barlow;border:1px dashed var(--mut);background:none;color:var(--ink);border-radius:20px;padding:3px 10px;cursor:pointer}
.bay{border:2px solid var(--line);border-radius:8px;background:var(--card);padding:14px;margin-bottom:12px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--grn)}
table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}select,td input{font:16px Barlow;padding:6px;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:90px}details summary{cursor:pointer;font:700 20px 'Barlow Condensed'}
details li{margin:6px 0}
:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
</style></head><body>

 return `<div class="panel"><div class="row"><h2>Order #${o.id} ${o.pri?'<span class="tag pri">Priority</span>':''}</h2><button class="btn sm" onclick="S.od=null;render()">Close</button></div><p>${o.ch} · ${o.cu} · ${o.c?C[o.c].n+', pickup '+fmt(C[o.c].t)+', ship by '+fmt(dl(o)):'No courier yet'}${h[1]?' · <b class="'+(h[0]==='late'?'red':'amb')+'">'+h[1]+'</b>':''}</p>
 <p>${ST.map((s,i)=>`<span class="tag ${i<ix?'grn':''}" style="${i===ix?'background:var(--blu);color:#fff;border-color:var(--blu)':''}">${s}</span>`).join(' → ')}</p>
 <table><tr><th>Item</th><th>Qty</th><th>Main</th><th>Warehouse B</th><th>Stock check</th></tr>${o.items.map(x=>{const k=S.K[x[0]];return `<tr><td>${nm(x[0])}</td><td>${x[1]}</td><td>${k[0]}</td><td>${k[1]}</td><td>${x[2]?'Picked':k[0]>=x[1]?'OK':k[1]>=x[1]-k[0]?'<b class="amb">Transfer required</b>':'<b class="red">Out of stock</b>'}</td></tr>`}).join('')}</table>
 <h3 style="margin-top:10px">Activity</h3>${(S.L||[]).filter(l=>l.o===o.id).map(l=>`<div class="mut">${l.w} · ${RN[l.r]} · ${AN[l.a]} ${l.g}</div>`).join('')||'<div class="mut">No activity recorded yet.</div>'}</div>`}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const rows=[],g={},L=r.result.trim().split(/\r?\n/).slice(1);L.forEach((l,n)=>{const[id,ch,pr,cu,sku,q]=l.split(',').map(x=>x.trim());let b='';if(!P[sku]||(S.ac&&S.ac[sku]===0))b='Unknown or inactive SKU';else if(!(+q>0))b='Missing or invalid quantity';else if(ord(+id))b='Duplicate order number';if(b)rows.push([n+2,id,b,b[0]==='D'?'Skip':'Reject']);else(g[id]=g[id]||{ch,pr,cu,it:[]}).it.push([sku,+q,0])});S.pv={n:L.length,rows,g};S.imp=null;render()};r.readAsText(f);el.value=''}
function pvh(){const v=S.pv,ok=v.n-v.rows.length,d=v.rows.filter(x=>x[3]==='Skip').length,k=Object.keys(v.g).length;return `<div class="panel"><h3 style="font-size:24px">Import validation</h3><p>${v.n} rows received · <span class="tag grn">${ok} valid</span> <span class="tag amb">${d} duplicate</span> <span class="tag red">${v.rows.length-d} rejected</span></p>${v.rows.length?`<table><tr><th>Row</th><th>Order</th><th>Issue</th><th>Action</th></tr>${v.rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('')}</table>`:''}<p><button class="btn p" onclick="doimp()">Import ${k} valid order${k===1?'':'s'}</button> <button class="btn" onclick="S.pv=null;render()">Cancel</button></p></div>`}
function doimp(){let n=0;for(const id in S.pv.g){const o=S.pv.g[id];S.O.push({id:+id,ch:o.ch,pri:/^(1|yes|high|critical)$/i.test(o.pr)?1:0,cu:o.cu,items:o.it,stage:'new',c:null});n++}const bad=S.pv.rows.filter(x=>x[3]==='Reject').length;if(bad)S.I.push({id:Date.now(),type:'Import error',o:'IMPORT',note:bad+' rows were rejected during import.',owner:'Office',done:0});S.imp='Imported '+n+' orders. '+S.pv.rows.length+' rows were skipped or rejected.';S.pv=null;render()}
function kpiv(){const A=S.O.filter(o=>o.stage!=='shipped'),sh=S.O.length-A.length,pr=S.O.filter(o=>o.pri),mis=S.I.filter(i=>i.type==='Missed pickup').length,op=S.I.filter(i=>!i.done),age=op.length?Math.round(op.reduce((a,i)=>a+S.now-i.t,0)/op.length):0,late=A.filter(o=>health(o)[0]==='late').length,pct=(a,b)=>b?Math.round(a/b*1000)/10+'%':'n/a',sc=S.sc||0,ws=S.ws||0;
 const k=[['Orders received',S.O.length],['Shipped',sh],['On-time shipment',pct(sh,sh+late+mis)],['Priority staged or shipped',pct(pr.filter(o=>o.stage==='shipped'||o.stage==='staged').length,pr.length)],['Scan accuracy (right first time)',sc?pct(sc-ws,sc):'no scans yet'],['Courier pickup success',pct(sh,sh+mis)],['Open exceptions',op.length],['Average exception age',age+' min']];
 const sk=Object.keys(P).map(s=>[s,vel(s),S.K[s][0]+S.K[s][1]]).sort((a,b)=>b[1]-a[1]).slice(0,8);
 return `<h2 style="font-size:32px">Analytics</h2><div class="stats" style="margin:12px 0">${k.map(x=>`<div style="flex-direction:column;gap:0"><span class="num">${x[1]}</span><span>${x[0]}</span></div>`).join('')}</div>
 <div class="panel" style="overflow-x:auto"><h3>By channel</h3><table><tr><th>Channel</th><th>Orders</th><th>Shipped</th><th>Priority</th></tr>${['Amazon','Own site','Alibaba'].map(c=>{const l=S.O.filter(o=>o.ch===c);return `<tr><td>${c}</td><td>${l.length}</td><td>${l.filter(o=>o.stage==='shipped').length}</td><td>${l.filter(o=>o.pri).length}</td></tr>`}).join('')}</table></div>
 <div class="panel" style="overflow-x:auto"><h3>By courier</h3><table><tr><th>Courier</th><th>Boxes</th><th>Shipping cost</th><th>Missed pickups</th></tr>${Object.keys(C).map(c=>{const n=S.O.filter(o=>o.c===c).length;return `<tr><td>${C[c].n}</td><td>${n}</td><td>₹${n*C[c].cost}</td><td>${S.I.filter(i=>i.type==='Missed pickup'&&i.note.includes(C[c].n)).length}</td></tr>`}).join('')}</table></div>
 <div class="panel" style="overflow-x:auto"><h3>Top SKUs today</h3><table><tr><th>SKU</th><th>Product</th><th>Units ordered</th><th>Stock left</th><th>Days of cover</th></tr>${sk.map(x=>`<tr><td>${x[0]}</td><td>${nm(x[0])}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[1]?(x[2]/x[1]).toFixed(1):'-'}</td></tr>`).join('')}</table></div>`}
function skuv(){const q=(S.sq||'').toLowerCase();return `<h2 style="font-size:32px">Products / SKU master</h2><p class="mut">The single list of what you sell. Inactive SKUs are rejected on import. The reorder level feeds the inventory alerts.</p><input id="sq" placeholder="Search SKU or product" value="${S.sq||''}" oninput="S.sq=this.value;render();const e=document.getElementById('sq');e.focus();e.setSelectionRange(99,99)" style="width:260px;margin-bottom:10px"><div class="panel" style="overflow-x:auto"><table><tr><th>SKU</th><th>Product</th><th>Variant</th><th>Shelf</th><th>Unit cost</th><th>Price</th><th>Margin</th><th>Reorder level</th><th>Active</th></tr>${Object.keys(P).filter(s=>!q||(s+' '+P[s][0]+' '+P[s][1]).toLowerCase().includes(q)).map(s=>{const m=PM[s];return `<tr><td>${s}</td><td>${P[s][0]}</td><td>${P[s][1]}</td><td>${P[s][2]}</td><td>₹${m[0]}</td><td>₹${m[1]}</td><td>${Math.round((m[1]-m[0])/m[1]*100)}%</td><td><input type="number" min="0" value="${RL(s)}" onchange="S.rl=S.rl||{};S.rl['${s}']=+this.value;render()"></td><td><input type="checkbox" style="width:auto" ${S.ac&&S.ac[s]===0?'':'checked'} onchange="S.ac=S.ac||{};S.ac['${s}']=this.checked?1:0;render()"></td></tr>`}).join('')}</table></div>`}
const ROLES={lead:['office','floor','inv','recv','pickups','issues','kpi','sku','log'],office:['office','issues','pickups'],wh:['floor','pickups'],inv:['inv','recv','sku','issues']},RN={lead:'Operations lead',office:'Office',wh:'Warehouse',inv:'Inventory owner'},AN={label:'Label made',scan:'Scan',mv:'Moved stock from B',cant:'Reported stock missing',bay:'Box placed in bay',fix:'Exception resolved',conf:'Pickup confirmed',tr:'Stock transfer',rcv:'Delivery booked in',put:'Delivery put away',pdm:'Reported packing damage',tp:'Priority changed',hold:'Order put on hold',doimp:'Orders imported',tick:'Clock moved 30 min'};
function tp(id){const o=ord(id);o.pri=o.pri?0:1;render()}
function hold(id){S.I.push({id:Date.now(),type:'Manual hold',o:id,note:'Put on hold by '+RN[S.role]+'.',owner:'Office',done:0});render()}
function setRole(r){S.role=r;S.tab=ROLES[r][0];S.open=null;S.msg=null;render()}
function ff(o){const q=S.f.q.toLowerCase();return(!q||(o.id+' '+o.cu+' '+o.ch+' '+o.items.map(x=>x[0]+' '+P[x[0]][0]+' '+P[x[0]][1]).join(' ')).toLowerCase().includes(q))&&(!S.f.ch||o.ch===S.f.ch)&&(!S.f.pri||o.pri)}
function fbar(){return `<div class="panel row"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="fq" placeholder="Search order, customer, SKU" value="${S.f.q}" oninput="S.f.q=this.value;render();const e=document.getElementById('fq');e.focus();e.setSelectionRange(99,99)" style="width:240px"><select onchange="S.f.ch=this.value;render()" style="width:auto"><option value="">All channels</option>${['Amazon','Own site','Alibaba'].map(c=>`<option ${S.f.ch===c?'selected':''}>${c}</option>`).join('')}</select><label><input type="checkbox" style="width:auto" ${S.f.pri?'checked':''} onchange="S.f.pri=this.checked?1:0;render()"> Priority only</label></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label class="btn sm">Import orders (CSV)<input type="file" accept=".csv" hidden onchange="imp(this)"></label><button class="btn sm" onclick="S.sum=!S.sum;render()">Daily summary</button></div></div>${S.pv?pvh():''}${S.imp?`<div class="msg ok">${S.imp}</div>`:''}${S.sum?dsum():''}`}
function dsum(){const A=S.O.filter(o=>o.stage!=='shipped'),h=k=>A.filter(o=>health(o)[0]===k).length,low=Object.keys(P).filter(s=>S.K[s][0]+S.K[s][1]<RL(s)).length;return `<div class="panel"><h3 style="font-size:24px">Daily summary at ${fmt(S.now)}</h3><p>Shipped <b>${S.O.length-A.length}</b> · Staged awaiting pickup <b>${A.filter(o=>o.stage==='staged').length}</b> · Late <b>${h('late')}</b> · At risk <b>${h('risk')}</b> · Priority still open <b>${A.filter(o=>o.pri).length}</b></p><p>Exceptions <b>${S.I.filter(i=>!i.done).length}</b> open, <b>${S.I.filter(i=>i.done).length}</b> resolved · SKUs low or out <b>${low}</b></p></div>`}
function batch(){const m={};S.O.filter(o=>o.c&&o.stage==='labelled'&&health(o)[0]!=='blocked').forEach(o=>o.items.filter(x=>!x[2]).forEach(x=>{const e=m[x[0]]=m[x[0]]||[0,0];e[0]+=x[1];e[1]++}));return `<details class="panel"><summary>Batch pick list (walk the aisles once)</summary><table><tr><th>Shelf</th><th>Item</th><th>Total to pick</th><th>Orders</th></tr>${Object.keys(m).sort((a,b)=>P[a][2]<P[b][2]?-1:1).map(s=>`<tr><td><b>${P[s][2]}</b></td><td>${nm(s)}</td><td>${m[s][0]}</td><td>${m[s][1]}</td></tr>`).join('')}</table></details>`}
function logv(){return `<h2 style="font-size:32px">Audit log</h2><p class="mut">Who did what. Newest first.</p><div class="panel" style="overflow-x:auto"><table><tr><th>Time</th><th>Who</th><th>Action</th><th>Details</th></tr>${(S.L||[]).map(l=>`<tr><td>${l.w}</td><td>${RN[l.r]}</td><td>${AN[l.a]}</td><td>${l.g}</td></tr>`).join('')||'<tr><td colspan="4">No actions yet.</td></tr>'}</table></div>`}
Object.keys(AN).forEach(n=>{const f=window[n];if(!f)return;window[n]=function(...a){S.L=S.L||[];S.L.unshift({w:new Date().toLocaleTimeString(),r:S.role,a:n,o:(typeof a[0]==='number'&&ord(a[0]))?a[0]:S.open,g:a.filter(x=>typeof x!=='object').join(', ')});S.L.length=Math.min(S.L.length,200);return f.apply(this,a)}});
init();
</script></body></html>
